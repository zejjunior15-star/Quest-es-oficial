<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Código Penal — Oficial de Justiça</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>📚 Código Penal</h1>
            <p>Oficial de Justiça</p>
        </header>

        <section class="progress-area">
            <div class="progress-text">
                <span id="question-number">Questão 1</span>
                <span id="score">0 acertos · 0 erros</span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>
        </section>

        <section class="card">

            <div class="card-number" id="card-number">
                Questão 1 de 30
            </div>

            <div class="question" id="question">
                Carregando...
            </div>

            <button id="show-answer" class="primary-button">
                👁️ Mostrar resposta
            </button>

            <div id="answer-area" class="answer-area hidden">

                <div class="answer-title">
                    Resposta
                </div>

                <div id="answer" class="answer">
                </div>

                <div class="result-buttons">

                    <button id="wrong" class="wrong-button">
                        ❌ Errei
                    </button>

                    <button id="correct" class="correct-button">
                        ✅ Acertei
                    </button>

                </div>

            </div>

        </section>

        <section class="navigation">

            <button id="previous" class="secondary-button">
                ← Anterior
            </button>

            <button id="next" class="secondary-button">
                Próxima →
            </button>

        </section>

        <section class="bottom-buttons">

            <button id="shuffle">
                🔀 Embaralhar
            </button>

            <button id="reset">
                🔄 Reiniciar
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
